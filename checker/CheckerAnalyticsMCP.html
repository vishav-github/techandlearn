<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checker Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <aside class="fixed left-0 top-0 h-full w-64 bg-slate-900 text-white p-6 z-50">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center font-bold">C</div>
            <h1 class="text-xl font-bold tracking-tight">Checker MCP</h1>
        </div>
        <nav class="space-y-1">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Analysis</p>
            <button onclick="loadDashboardData()" class="w-full flex items-center gap-3 p-3 bg-blue-600 rounded-lg text-sm text-left">Refresh Overview</button>
            <button onclick="fetchBranchScores()" class="w-full flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg text-sm text-slate-400 text-left">Branch Scores</button>
            <button onclick="alert('Tool: get_trends')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg text-sm text-slate-400 text-left">Trends & Usage</button>
        </nav>
    </aside>

    <main class="ml-64 p-8" id="dashboard-content">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold">Analytics Overview</h2>
                <p class="text-slate-500" id="connection-status">Connecting to MCP Proxy on 6274...</p>
            </div>
            <div class="flex gap-3">
                <button onclick="loadDashboardData()" class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50 shadow-sm">Sync Now</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Global Score</p>
                <h3 class="text-3xl font-bold mt-2" id="stat-score">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Total Branches</p>
                <h3 class="text-3xl font-bold mt-2" id="stat-branches">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Total Usage</p>
                <h3 class="text-3xl font-bold mt-2" id="stat-usage">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-sm font-medium text-slate-500">Active Tasks</p>
                <h3 class="text-3xl font-bold mt-2" id="stat-tasks">--</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-lg mb-6">Recent Evaluations</h3>
                <div id="evaluation-list" class="space-y-3 text-sm text-slate-600">
                    Click "Refresh" to pull data from your tools...
                </div>
            </div>

            <div class="glass p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-lg mb-4">Branch Rankings</h3>
                <div id="branch-ranking-list" class="space-y-4">
                    </div>
            </div>
        </div>
    </main>

    <script>
        const PROXY_URL = "http://localhost:6274";

        /**
         * Generic Function to call any MCP Tool
         */
        async function callTool(name, args = {}) {
            try {
                const response = await fetch(`${PROXY_URL}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        method: "tools/call",
                        params: { name: name, arguments: args }
                    })
                });
                const result = await response.json();
                
                // Parse the text content returned by MCP
                if (result && result.content && result.content[0]) {
                    return JSON.parse(result.content[0].text);
                }
                return null;
            } catch (error) {
                console.error(`Error calling ${name}:`, error);
                document.getElementById('connection-status').innerText = "Status: Connection Failed (Check Proxy)";
                document.getElementById('connection-status').className = "text-red-500 text-sm";
                return null;
            }
        }

        /**
         * Update Dashboard Statistics
         */
        async function loadDashboardData() {
    document.getElementById('dashboard-content').classList.add('loading');
    
    // 1. Get Summary
    const summary = await callTool('get_evaluation_summary');
    if (summary) {
        document.getElementById('stat-score').innerText = (summary.score || summary.avg || 0) + "%";
    }

    // 2. Get Usage (One of your 21 tools)
    const usage = await callTool('get_usage');
    if (usage) {
        document.getElementById('stat-usage').innerText = usage.total_calls || 0;
    }

    // 3. Populate the Recent Evaluations List
    const tasks = await callTool('list_tasks');
    if (tasks && tasks.length > 0) {
        const listContainer = document.getElementById('evaluation-list');
        listContainer.innerHTML = tasks.slice(0, 5).map(task => `
            <div class="flex justify-between p-3 bg-white rounded-lg border border-slate-100 shadow-sm">
                <span><strong>${task.type || 'Task'}:</strong> ${task.title || task.id}</span>
                <span class="text-blue-500 font-mono">${task.status || 'Active'}</span>
            </div>
        `).join('');
    }

    document.getElementById('dashboard-content').classList.remove('loading');
}

        /**
         * Update Branch Rankings
         */
        async function fetchBranchScores() {
            const data = await callTool('get_top_bottom', { limit: 5 });
            const listContainer = document.getElementById('branch-ranking-list');
            
            if (data && data.top) {
                listContainer.innerHTML = data.top.map(item => `
                    <div class="flex justify-between items-center border-b border-slate-50 pb-2">
                        <span class="text-sm font-medium">${item.name || item.branch_name}</span>
                        <span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold">${item.score}%</span>
                    </div>
                `).join('');
            } else {
                listContainer.innerHTML = "<p class='text-xs text-slate-400'>No branch data available.</p>";
            }
        }

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            fetchBranchScores();
        });
    </script>
</body>
</html>
