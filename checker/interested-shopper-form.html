<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Your Interest - Become a Shopper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .company-logo {
            margin-bottom: 25px;
            /* Fixed container size */
            width: 150px;  /* Set a fixed width */
            height: 50px;  /* Set a fixed height */
            overflow: hidden; /* Hide any overflow if image is larger */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: auto;
            margin-right: auto;
        }
        .company-logo img {
            max-width: 100%; /* Ensure image scales down to fit container width */
            max-height: 100%; /* Ensure image scales down to fit container height */
            object-fit: contain; /* Scales the image to fit the content box while preserving aspect ratio */
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .privacy-note {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        .social-media {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .social-media p {
            margin-bottom: 15px;
        }
        .social-media a {
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: #007bff;
            font-size: 24px;
        }
        .social-media a:hover {
            opacity: 0.8;
        }
        /* Basic social icon styling - in a real app, use font-awesome or SVG icons */
        .social-media .icon::before {
            content: ""; /* Cleared for better placeholder */
            font-family: 'Arial', sans-serif; /* Fallback for placeholders */
        }
        .social-media .icon-facebook::before { content: "f"; }
        .social-media .icon-twitter::before { content: "t"; }
        .social-media .icon-linkedin::before { content: "l"; }
    </style>
</head>
<body>
    <div class="container">
        <div class="company-logo">
            <img src="https://techandlearn.in/images/techandlearnlogo.jpeg" alt="Your Company Logo">
        </div>
        <h2>Become a Shopper!</h2>
        <p>Ready to join our team of mystery shoppers? Tell us a little about yourself, and we'll reach out with the next steps.</p>
        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
            </div>
            <button type="submit">Express My Interest</button>
            <p class="privacy-note">By submitting, you agree to our <a href="#">Privacy Policy</a>. We will use this information to contact you about becoming a shopper.</p>
        </form>

        <div class="social-media">
            <p>Connect with us:</p>
            <a href="https://facebook.com/yourcompany" target="_blank" aria-label="Facebook">
                <span class="icon icon-facebook">📘</span>
            </a>
            <a href="https://twitter.com/yourcompany" target="_blank" aria-label="Twitter">
                <span class="icon icon-twitter">🐦</span>
            </a>
            <a href="https://linkedin.com/company/yourcompany" target="_blank" aria-label="LinkedIn">
                <span class="icon icon-linkedin">🔗</span>
            </a>
        </div>
    </div>
</body>
</html>
