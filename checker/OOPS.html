<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branch Visit Report</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f6f8;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: #1a1d23;
    padding: 32px;
  }

  .report-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .report-title {
    font-size: 15px;
    font-weight: 500;
    color: #1a1d23;
  }

  .report-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #8a909e;
  }

  .sort-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #2563eb;
    background: #eff4ff;
    border: 1px solid #c7d7fd;
    padding: 3px 10px;
    border-radius: 4px;
  }

  .grid-wrap {
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: #f0f2f5;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7280;
    padding: 11px 16px;
    text-align: left;
    border-bottom: 2px solid #d1d5db;
    white-space: nowrap;
  }

  thead th.sorted {
    color: #2563eb;
  }

  thead th .sort-arrow {
    display: inline-block;
    margin-left: 4px;
    color: #2563eb;
  }

  tbody tr {
    border-bottom: 1px solid #e5e7eb;
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f9fafb; }

  td {
    padding: 12px 16px;
    vertical-align: top;
  }

  /* Q# column */
  .col-q {
    width: 48px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
  }

  /* REPORT column */
  .col-report {
    min-width: 140px;
    font-weight: 500;
    color: #111827;
  }

  /* DATE column */
  .col-date {
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #4b5563;
  }

  /* TIME column */
  .col-time {
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: #2563eb;
  }

  .col-time.empty {
    color: #d1d5db;
    font-style: italic;
    font-size: 11px;
  }

  /* SCORE column */
  .col-score {
    width: 80px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }

  .score-high { color: #16a34a; }
  .score-mid  { color: #d97706; }
  .score-low  { color: #dc2626; }

  /* COMMENT column */
  .col-comment {
    font-size: 12.5px;
    color: #4b5563;
    line-height: 1.5;
    max-width: 380px;
  }

  .export-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .btn-export {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    background: #fff;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-export:hover {
    border-color: #2563eb;
    color: #2563eb;
  }
</style>
</head>
<body>

<div class="report-header">
  <div>
    <div class="report-title">Visit Report — Branch Central</div>
    <div class="report-meta">10.02.2026 &nbsp;·&nbsp; Visit 1 &nbsp;·&nbsp; 11 venues</div>
  </div>
  <div class="sort-label">↑ Sorted by TIME · Ascending</div>
</div>

<div class="grid-wrap">
  <table id="reportTable">
    <thead>
      <tr>
        <th class="col-q">Q</th>
        <th>Report</th>
        <th>Date</th>
        <th class="sorted">Time <span class="sort-arrow">↑</span></th>
        <th>Score</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="export-row">
  <button class="btn-export" onclick="exportCSV()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Export
  </button>
</div>

<script>
const rows = [
  { q: 1,  venue: "Foyer",               date: "10.02.2026", time: "07:00:00", score: 90,  comment: "Overall comment to describe the Foyer visit. Morbi egestas vehicula massa, sed congue mi fringilla." },
  { q: 8,  venue: "Restaurant",          date: "10.02.2026", time: "09:27:00", score: 90,  comment: "Quisque facilisis quis odio at maximus. Maecenas nunc enim, convallis sit amet varius eu." },
  { q: 6,  venue: "Bistro",              date: "10.02.2026", time: "09:51:00", score: 20,  comment: "Vestibulum purus. Nullam ornare placerat magna ac commodo. Vestibulum nec pulvinar dolor." },
  { q: 5,  venue: "Bar",                 date: "10.02.2026", time: "10:00:00", score: 40,  comment: "Vivamus non vestibulum est. Vestibulum eu neque sed odio porttitor feugiat eget aliquet odio." },
  { q: 9,  venue: "Restrooms – Catering",date: "10.02.2026", time: "10:36:00", score: 90,  comment: "Overall comment to describe your Restroom – Catering visit. Lorem ipsum dolor sit amet." },
  { q: 7,  venue: "Coffee Shop",         date: "10.02.2026", time: "13:34:00", score: 100, comment: "Overall comment to describe your Coffee Shop visit. Lorem ipsum dolor sit amet, consectetur." },
  { q: 3,  venue: "Membership",          date: "10.02.2026", time: "15:20:00", score: 60,  comment: "Overall comment to describe the Membership visit. Nullam nec dapibus libero. Aenean quis." },
  { q: 4,  venue: "Gaming",              date: "10.02.2026", time: "15:45:00", score: 100, comment: "Overall comment to describe the Gaming visit. Proin iaculis scelerisque justo, sed ultrices purus." },
  { q: 2,  venue: "Security",            date: "10.02.2026", time: "16:35:00", score: 100, comment: "Overall comment to describe your Security visit. Lorem ipsum dolor sit amet, consectetur adipiscing." },
  { q: 10, venue: "Restrooms",           date: "10.02.2026", time: "17:10:00", score: 60,  comment: "Overall comment to describe your Restroom visit. Nullam nec dapibus libero. Aenean quis." },
  { q: 11, venue: "Dining",              date: "10.02.2026", time: "21:05:00", score: 30,  comment: "Overall comment to describe your Dining visit. Lorem ipsum dolor sit amet, consectetur adipiscing." },
];

rows.sort((a, b) => {
  if (!a.time) return 1;
  if (!b.time) return -1;
  return a.time.localeCompare(b.time);
});

function scoreClass(s) {
  if (s >= 80) return 'score-high';
  if (s >= 50) return 'score-mid';
  return 'score-low';
}

const tbody = document.getElementById('tableBody');
rows.forEach((r, i) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="col-q">${r.q}</td>
    <td class="col-report">${r.venue}</td>
    <td class="col-date">${r.date}</td>
    <td class="col-time${r.time ? '' : ' empty'}">${r.time || '—'}</td>
    <td class="col-score ${scoreClass(r.score)}">${r.score}</td>
    <td class="col-comment">${r.comment}</td>
  `;
  tbody.appendChild(tr);
});

function exportCSV() {
  const headers = ['Q','Report','Date','Time','Score','Comment'];
  const csvRows = rows.map(r => [r.q, r.venue, r.date, r.time || '', r.score, `"${r.comment}"`]);
  const csv = [headers.join(','), ...csvRows.map(r => r.join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'visit-report.csv';
  a.click();
}
</script>
</body>
</html>
