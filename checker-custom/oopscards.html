<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecard Grid · Inspection Dashboard</title>
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f7fc;
      font-family: 'Inter', sans-serif;
      padding: 30px 24px;
      color: #1e293b;
    }

    .dashboard {
      max-width: 1440px;
      margin: 0 auto;
    }

    h1 {
      font-weight: 600;
      font-size: 28px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subhead {
      color: #64748b;
      margin-bottom: 28px;
      font-weight: 400;
      font-size: 15px;
      border-left: 4px solid #3b82f6;
      padding-left: 16px;
    }

    /* Grid layout */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    /* Card design */
    .scorecard {
      background: #ffffff;
      border-radius: 24px;
      padding: 22px 20px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
      border: 1px solid #eef2f6;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(2px);
    }

    .scorecard:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -8px rgba(0,34,68,0.12), 0 4px 12px rgba(0,0,0,0.04);
      border-color: #d0ddee;
    }

    /* Header: title + score badge */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title-section h3 {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: #0f172a;
    }

    .score-badge {
      font-weight: 700;
      font-size: 26px;
      line-height: 1;
      padding: 6px 12px;
      border-radius: 60px;
      background: #f8fafc;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
    }

    /* Score color coding */
    .score-high { color: #0d9488; background: #e6f7f5; }
    .score-mid { color: #b45309; background: #fef6e6; }
    .score-low { color: #b91c1c; background: #fee9e9; }

    /* Last inspection */
    .last-inspect {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
      background: #fafcff;
      padding: 6px 10px;
      border-radius: 30px;
      width: fit-content;
      border: 1px solid #e9edf2;
    }

    .last-inspect i {
      font-size: 12px;
      color: #3b82f6;
    }

    /* Sparkline row */
    .trend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .trend-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #64748b;
    }

    .sparkline-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    canvas.spark {
      width: 80px;
      height: 28px;
      display: block;
    }

    .trend-change {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .trend-up { color: #0d9488; }
    .trend-down { color: #b91c1c; }
    .trend-neutral { color: #64748b; }

    /* Progress bar */
    .progress-section {
      margin: 14px 0 16px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .progress-bar-bg {
      height: 8px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 20px;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      transition: width 0.3s;
    }

    /* Footer: description preview + tooltip trigger */
    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #475569;
      border-top: 1px dashed #dce3ec;
      padding-top: 14px;
    }

    .desc-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      font-style: italic;
    }

    .tooltip-icon {
      margin-left: auto;
      color: #94a3b8;
      cursor: help;
      transition: color 0.2s;
    }

    .tooltip-icon:hover {
      color: #1e293b;
    }

    /* Custom tooltip (pseudo, but we'll use a data attribute popup with JS) */
    .scorecard {
      position: relative;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 16px; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <h1>
    <i class="fas fa-clipboard-list" style="color: #2563eb;"></i>
    Inspection Scorecard
  </h1>
  <div class="subhead">Live overview · hover for details · click card to expand (demo)</div>

  <div class="card-grid" id="scorecardGrid"></div>
</div>

<!-- Simple tooltip container (floating) -->
<div id="customTooltip" style="position: fixed; background: #1e293b; color: white; padding: 12px 16px; border-radius: 16px; font-size: 13px; max-width: 280px; box-shadow: 0 20px 35px -5px rgba(0,0,0,0.25); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 999; backdrop-filter: blur(4px); border: 1px solid #334155;"></div>

<script>
  (function(){
    // ----- DATA from the table (with some additional mock history for sparklines) -----
    const inspectionData = [
      { title: "Coffee Shop", reportDate: "2025-12-02", time: "06:00:00", score: 70, description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua." },
      { title: "Restrooms", reportDate: "2025-12-02", time: "07:00:00", score: 75, description: "" },
      { title: "Security", reportDate: "2025-12-02", time: "07:11:00", score: 60, description: "" },
      { title: "Foyer", reportDate: "2025-12-01", time: "16:08:48", score: 100, description: "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum." },
      { title: "Bar", reportDate: "2025-12-01", time: "16:20:16", score: 30, description: "" },
      { title: "Bistro", reportDate: "2025-12-02", time: "17:29:57", score: 80, description: "g9" },
      { title: "Membership", reportDate: "2025-12-02", time: "18:43:39", score: 90, description: "" },
      { title: "Gaming", reportDate: "2025-12-02", time: "19:00:00", score: 40, description: "" },
      { title: "Restaurant", reportDate: "2025-12-02", time: "20:03:33", score: 80, description: "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat laborum." }
    ];

    // Simulate historical scores (3 previous values) for sparklines + trend
    // For real implementation you'd fetch actual history. Here we generate plausible variations.
    function generateHistory(baseScore) {
      let history = [];
      for (let i = 0; i < 3; i++) {
        let variation = Math.floor(Math.random() * 21) - 10; // -10 .. +10
        let past = Math.min(100, Math.max(10, baseScore + variation));
        history.push(past);
      }
      // Ensure it ends with current score as last point? We'll push current later
      return history;
    }

    // Enhance data with history and derived fields
    const enriched = inspectionData.map(item => {
      const history = generateHistory(item.score);
      const fullHistory = [...history, item.score]; // last point is current
      const lastThree = fullHistory.slice(-3);
      
      // simple trend direction based on last two points
      let trendDir = 'neutral';
      let changePercent = 0;
      if (lastThree.length >= 2) {
        const diff = lastThree[lastThree.length-1] - lastThree[lastThree.length-2];
        changePercent = Math.round((diff / (lastThree[lastThree.length-2] || 1)) * 100);
        if (diff > 2) trendDir = 'up';
        else if (diff < -2) trendDir = 'down';
      }

      return {
        ...item,
        history: fullHistory,
        lastThree: lastThree,
        trendDir,
        changePercent: Math.abs(changePercent)
      };
    });

    // Helper: get score class
    function getScoreClass(score) {
      if (score >= 80) return 'score-high';
      if (score >= 50) return 'score-mid';
      return 'score-low';
    }

    // Format date/time nicely
    function formatDateTime(dateStr, timeStr) {
      const d = new Date(dateStr + 'T' + timeStr);
      return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Render grid
    const grid = document.getElementById('scorecardGrid');
    
    enriched.forEach(item => {
      const card = document.createElement('div');
      card.className = 'scorecard';
      card.dataset.title = item.title;
      card.dataset.description = item.description || 'No additional notes.';
      card.dataset.fullDate = formatDateTime(item.reportDate, item.time);

      // Score badge class
      const scoreClass = getScoreClass(item.score);
      
      // Build inner HTML
      card.innerHTML = `
        <div class="card-header">
          <div class="title-section">
            <h3>${item.title}</h3>
          </div>
          <div class="score-badge ${scoreClass}">${item.score}</div>
        </div>
        
        <div class="last-inspect">
          <i class="far fa-calendar-alt"></i>
          <span>${formatDateTime(item.reportDate, item.time)}</span>
        </div>

        <div class="trend-row">
          <span class="trend-label"><i class="far fa-chart-line"></i> Trend (3‑pt)</span>
          <div class="sparkline-container">
            <canvas class="spark" width="80" height="28" data-history='${JSON.stringify(item.lastThree)}'></canvas>
            <span class="trend-change ${item.trendDir === 'up' ? 'trend-up' : (item.trendDir === 'down' ? 'trend-down' : 'trend-neutral')}">
              ${item.trendDir === 'up' ? '▲' : (item.trendDir === 'down' ? '▼' : '●')} ${item.changePercent}%
            </span>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-label">
            <span>Score vs target (100)</span>
            <span>${item.score}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-fill" style="width: ${item.score}%; background: ${item.score >= 80 ? '#0d9488' : (item.score >= 50 ? '#d97706' : '#b91c1c')};"></div>
          </div>
        </div>

        <div class="card-footer">
          <i class="far fa-file-alt"></i>
          <span class="desc-preview">${item.description ? item.description.substring(0, 30) + '…' : '— no notes —'}</span>
          <span class="tooltip-icon" data-tooltip="true"><i class="far fa-question-circle"></i></span>
        </div>
      `;
      grid.appendChild(card);
    });

    // ----- Draw sparklines (canvas) -----
    const canvases = document.querySelectorAll('canvas.spark');
    canvases.forEach(canvas => {
      const ctx = canvas.getContext('2d');
      const historyStr = canvas.dataset.history;
      if (!historyStr) return;
      const values = JSON.parse(historyStr); // array of 3 numbers
      
      const w = 80, h = 28;
      canvas.width = w;
      canvas.height = h;
      
      const padding = 2;
      const maxVal = Math.max(...values, 100);
      const minVal = Math.min(...values, 0);
      const range = maxVal - minVal || 1;
      
      // Scale points
      const points = values.map((v, i) => ({
        x: padding + (i / (values.length - 1)) * (w - 2 * padding),
        y: h - padding - ((v - minVal) / range) * (h - 2 * padding)
      }));
      
      // Draw line
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      
      // Draw dots
      points.forEach((p, idx) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, idx === points.length-1 ? 3 : 2.5, 0, 2 * Math.PI);
        ctx.fillStyle = idx === points.length-1 ? '#2563eb' : '#94a3b8';
        ctx.shadowColor = '#3b82f6';
        ctx.shadowBlur = idx === points.length-1 ? 6 : 3;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    });

    // ----- Custom Tooltip logic -----
    const tooltipEl = document.getElementById('customTooltip');
    let tooltipTimeout;

    function showTooltip(text, x, y) {
      tooltipEl.innerHTML = text;
      tooltipEl.style.left = (x + 15) + 'px';
      tooltipEl.style.top = (y - 10) + 'px';
      tooltipEl.style.opacity = '1';
    }

    function hideTooltip() {
      tooltipEl.style.opacity = '0';
    }

    document.querySelectorAll('.scorecard').forEach(card => {
      const tooltipTrigger = card.querySelector('.tooltip-icon');
      if (!tooltipTrigger) return;

      tooltipTrigger.addEventListener('mouseenter', (e) => {
        const title = card.dataset.title;
        const desc = card.dataset.description;
        const date = card.dataset.fullDate;
        const score = card.querySelector('.score-badge').textContent;
        const tooltipContent = `
          <div style="font-weight:600; margin-bottom:6px; font-size:15px;">${title}</div>
          <div style="display:flex; gap:16px; margin-bottom:8px;">
            <span><i class="far fa-star" style="margin-right:5px;"></i>Score: ${score}</span>
            <span><i class="far fa-clock"></i> ${date}</span>
          </div>
          <div style="border-top:1px solid #475569; margin:8px 0; padding-top:8px; line-height:1.5; color:#e2e8f0;">${desc || 'No description provided.'}</div>
          <div style="margin-top:6px; font-size:11px; opacity:0.7;">Click card for full history (demo)</div>
        `;
        const rect = tooltipTrigger.getBoundingClientRect();
        showTooltip(tooltipContent, rect.left + window.scrollX, rect.top + window.scrollY - 10);
      });

      tooltipTrigger.addEventListener('mouseleave', () => {
        hideTooltip();
      });

      // Also show tooltip on entire card hover (optional)
      card.addEventListener('mouseenter', (e) => {
        if (e.target.closest('.tooltip-icon')) return; // avoid double
        const title = card.dataset.title;
        const desc = card.dataset.description;
        const date = card.dataset.fullDate;
        const score = card.querySelector('.score-badge').textContent;
        const tooltipContent = `
          <div style="font-weight:600; margin-bottom:6px; font-size:15px;">${title}</div>
          <div style="display:flex; gap:16px; margin-bottom:8px;">
            <span><i class="far fa-star"></i> Score: ${score}</span>
            <span><i class="far fa-clock"></i> ${date}</span>
          </div>
          <div style="border-top:1px solid #475569; margin:8px 0; padding-top:8px;">${desc || '—'}</div>
        `;
        const rect = card.getBoundingClientRect();
        showTooltip(tooltipContent, rect.right - 260, rect.top + 50);
      });

      card.addEventListener('mouseleave', () => {
        hideTooltip();
      });

      // Click card to simulate drill-down (wow factor)
      card.addEventListener('click', () => {
        alert(`📊 ${card.dataset.title}\nLatest score: ${card.querySelector('.score-badge').textContent}\nInspection: ${card.dataset.fullDate}\n\n(Full history would open detail view)`);
      });
    });

    // Cleanup tooltip on scroll
    window.addEventListener('scroll', () => hideTooltip(), { passive: true });

  })();
</script>
</body>
</html>
